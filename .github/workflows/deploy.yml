name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
  # In-season refresh: Sunday morning ET after the Saturday slate, Thursday
  # morning so the at-risk page and its post draft from that morning's lines,
  # and Friday after MACtion. build-current.mjs fetches the current schedules
  # and AP poll and layers them onto the committed payload base.
  # December and January build every morning instead, at the Thursday hour:
  # bowls are played most days from mid-December, and the playoff's title game
  # is a Monday in January. About 17 CFBD calls a run, so a daily month is
  # about 530 of the key's 1,000. Rivalry week, conference title weekend and
  # Army-Navy are Friday and Saturday games, which the Sunday run already has.
  # (Cron reads a day of the month and a day of the week as either one, so the
  # weekly runs are limited by month and the daily ones by date.)
  schedule:
    - cron: '0 14 * 2-11 0,5'
    - cron: '0 13 * 2-11 4'
    - cron: '0 13 * 12 *'
    - cron: '0 13 1-27 1 *'

# The committed payload is the payload. A scheduled or manual run refreshes
# src/data/payload.json, tests it, commits it to main and deploys that commit;
# a push builds the payload main holds. Nothing ships that isn't committed, so
# no deploy can put an older week back (until 2026-11-16 a refresh deployed
# without committing, and a push replayed its inputs from the Actions cache).
# A push made with the workflow's own token starts no workflow, so the data
# commit doesn't deploy twice.
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.built.outputs.sha }}
    env:
      # The build's prerender mines every team's streaks (the slow part, about
      # ten minutes here) and writes the raw result to this file; the tests
      # read it instead of mining again, so the mine runs once per push.
      STREAK_MINED: data/build/mined.json
    steps:
      # main's tip, not the commit that started the run: a push queued behind
      # a refresh builds the payload the refresh just committed
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Refresh the in-progress season (schedule, AP poll, lines) onto the
      # committed payload base, on the scheduled and manual runs only. A push
      # spends no CFBD calls (October 2026: 78 push deploys at ~17 calls each
      # ate the key's 1,000-call monthly quota). A refresh that can't fetch
      # fails the run and the site keeps what it has.
      - if: github.event_name != 'push'
        run: node scripts/data/build-current.mjs
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      # Check and test the payload that ships
      - run: pnpm run typecheck
      # Every ruling-file receipt against its committed page (data/research/pages)
      - run: pnpm run check:receipts
      # The build first, since its mine feeds the tests (STREAK_MINED above);
      # a failing test still stops the commit and the upload.
      - run: pnpm run build
      - run: pnpm test
      # No deploy takes the live site back to an older payload
      - run: node scripts/data/check-not-older-than-live.mjs
        env:
          ALLOW_OLDER_DATA: ${{ contains(github.event.head_commit.message, '[older data]') && '1' || '' }}
      # The refreshed payload, committed before it deploys: the next push
      # builds from it. A commit pushed meanwhile is rebased under; one that
      # rewrote the payload conflicts and fails the run before anything ships.
      - if: github.event_name != 'push'
        run: |
          git add src/data/payload.json
          git diff --quiet --cached && exit 0
          git -c user.name="the refresh" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "The data at $(date -u +%Y-%m-%d)"
          git checkout -- .
          git pull -q --rebase origin main
          git push -q origin HEAD:main
      - id: built
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      # nobody reads a failed run: a refresh that fails opens an issue, and a
      # second failure comments on the open one
      - if: failure() && github.event_name != 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="The data refresh failed"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          open=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then gh issue comment "$open" --body "Failed again. $run"
          else gh issue create --title "$title" --body "The site keeps the data it had. $run" --assignee DrewHoo; fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Ask Bing and the other IndexNow engines to recrawl, once the pages are
  # live: a push sends the board, the definition pages and the schedule; the
  # scheduled refresh, which changes every page's data, sends the whole
  # sitemap. A failed ping never fails the deploy (the script exits 0).
  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # (an empty string is falsy in an expression, so the flag is the truthy branch)
      - run: node scripts/indexnow.mjs ${{ github.event_name != 'push' && '--all' || '' }}

  # The share worker (workers/share) bundles src/lib, so it ships with the
  # site. Needs a CLOUDFLARE_API_TOKEN repo secret: a token made from the
  # "Edit Cloudflare Workers" template. The weekly data refresh changes no
  # worker code, so it skips this.
  worker:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: github.event_name != 'schedule'
    steps:
      # the commit the site was built from
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.151.3' # the devDependency's version, so by-hand and CI deploys match
          command: deploy -c workers/share/wrangler.jsonc
