name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
  # In-season refresh: Sunday morning ET after the Saturday slate, Thursday
  # morning so the at-risk page and its post draft from that morning's lines,
  # and Friday after MACtion. build-current.mjs fetches the current schedules
  # and AP poll and layers them onto the committed payload base.
  # December and January build every morning instead, at the Thursday hour:
  # bowls are played most days from mid-December, and the playoff's title game
  # is a Monday in January. About 17 CFBD calls a run, so a daily month is
  # about 530 of the key's 1,000. Rivalry week, conference title weekend and
  # Army-Navy are Friday and Saturday games, which the Sunday run already has.
  # (Cron reads a day of the month and a day of the week as either one, so the
  # weekly runs are limited by month and the daily ones by date.)
  schedule:
    - cron: '0 14 * 2-11 0,5'
    - cron: '0 13 * 2-11 4'
    - cron: '0 13 * 12 *'
    - cron: '0 13 1-27 1 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The build's prerender mines every team's streaks (the slow part, about
      # ten minutes here) and writes the raw result to this file; the tests
      # read it instead of mining again, so the mine runs once per push.
      STREAK_MINED: data/build/mined.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      # Refresh the in-progress season (schedule + AP poll) onto the committed
      # payload base — only on the scheduled/manual refreshes. A push ships the
      # committed payload and spends no CFBD calls (October 2026: 78 push
      # deploys at ~17 calls each ate the key's 1,000-call monthly quota, and
      # three refreshes silently shipped stale data). A refresh that can't
      # fetch fails the run, so a dead key is an email, not a quiet stale week.
      - if: github.event_name != 'push'
        run: node scripts/data/build-current.mjs
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      # Check and test the payload that ships: the refreshed one on a
      # schedule/dispatch run, the committed one on a push.
      - run: npm run typecheck
      # Every ruling-file receipt against its committed page (data/research/pages)
      - run: npm run check:receipts
      # The build first, since its mine feeds the tests (STREAK_MINED above);
      # a failing test still stops the upload.
      - run: npm run build
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Ask Bing and the other IndexNow engines to recrawl, once the pages are
  # live: a push sends the board, the definition pages and the schedule; the
  # scheduled refresh, which changes every page's data, sends the whole
  # sitemap. A failed ping never fails the deploy (the script exits 0).
  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # (an empty string is falsy in an expression, so the flag is the truthy branch)
      - run: node scripts/indexnow.mjs ${{ github.event_name != 'push' && '--all' || '' }}

  # The share worker (workers/share) bundles src/lib, so it ships with the
  # site. Needs a CLOUDFLARE_API_TOKEN repo secret: a token made from the
  # "Edit Cloudflare Workers" template. The weekly data refresh changes no
  # worker code, so it skips this.
  worker:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.151.3' # the devDependency's version, so by-hand and CI deploys match
          command: deploy -c workers/share/wrangler.jsonc
