name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
  # In-season refresh: Sunday morning ET after the Saturday slate, Thursday
  # morning so the at-risk page and its post draft from that morning's lines,
  # and Friday after MACtion. build-current.mjs fetches the current schedules
  # and AP poll and layers them onto the committed payload base.
  schedule:
    - cron: '0 14 * * 0,5'
    - cron: '0 13 * * 4'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The build's prerender mines every team's streaks (the slow part, about
      # ten minutes here) and writes the raw result to this file; the tests
      # read it instead of mining again, so the mine runs once per push.
      STREAK_MINED: data/build/mined.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      # Refresh the in-progress season (schedule + AP poll) onto the committed
      # payload base. If the fetch fails, the committed payload still builds.
      - run: node scripts/data/build-current.mjs
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      # Check and test the payload that ships, whichever one the step above left.
      - run: npm run typecheck
      # Every ruling-file receipt against its committed page (data/research/pages)
      - run: npm run check:receipts
      # The build first, since its mine feeds the tests (STREAK_MINED above);
      # a failing test still stops the upload.
      - run: npm run build
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The share worker (workers/share) bundles src/lib, so it ships with the
  # site. Needs a CLOUDFLARE_API_TOKEN repo secret: a token made from the
  # "Edit Cloudflare Workers" template. The weekly data refresh changes no
  # worker code, so it skips this.
  worker:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.147.0'
          command: deploy -c workers/share/wrangler.jsonc
