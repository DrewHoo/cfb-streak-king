name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
  # In-season weekly refresh: Sunday and Friday mornings ET, after Saturday
  # slates and MACtion. build-current.mjs fetches the current schedules and
  # AP poll and layers them onto the committed payload base.
  schedule:
    - cron: '0 14 * * 0,5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      # Refresh the in-progress season (schedule + AP poll) onto the committed
      # payload base. If the fetch fails, the committed payload still builds.
      - run: node scripts/data/build-current.mjs
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
